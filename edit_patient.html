<div class="form-container">


<h2>Update Patient Information</h2>



<form action="/update_patient/{{ patient[0] }}" method="POST">



<label>
Full Name
</label>


<input

type="text"

name="name"

value="{{ patient[1] }}"

required>





<label>
Age
</label>


<input

type="number"

name="age"

value="{{ patient[2] }}"

required>





<label>
Gender
</label>


<select name="gender" required>


<option value="Male"

{% if patient[3]=="Male" %}

selected

{% endif %}

>

Male

</option>



<option value="Female"

{% if patient[3]=="Female" %}

selected

{% endif %}

>

Female

</option>



<option value="Other"

{% if patient[3]=="Other" %}

selected

{% endif %}

>

Other

</option>


</select>





<label>
Phone Number
</label>


<input

type="text"

name="phone"

value="{{ patient[4] }}"

required>





<label>
Disease
</label>


<input

type="text"

name="disease"

value="{{ patient[5] }}"

required>






<br><br>



<button type="submit">

</button>
