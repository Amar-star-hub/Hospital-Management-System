<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Appointment</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">


<style>

.form-container{
    width:450px;
    margin:auto;
}


input,select{

    width:100%;
    padding:10px;
    margin-bottom:15px;

}


button{

    width:100%;
    padding:12px;
    background:#0077b6;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;

}


button:hover{

    background:#023e8a;

}


label{

    font-weight:bold;

}


</style>


</head>



<body>



<header>

<h1>📅 Book Hospital Appointment</h1>


<nav>

<a href="/">Home</a>

<a href="/patients">Register Patient</a>

<a href="/patient_list">Patients</a>

<a href="/appointment_list">Appointments</a>

</nav>


</header>





<div class="form-container">


<h2>Appointment Details</h2>



<form action="/book_appointment" method="POST">



<label>
Patient Name
</label>


<input

type="text"

name="patient_name"

placeholder="Enter patient name"

required>





<label>
Doctor Name
</label>


<select name="doctor" required>


<option value="">
-- Select Doctor --
</option>


<option>
Dr. Patil - Cardiologist
</option>


<option>
Dr. Sharma - Physician
</option>


<option>
Dr. Kulkarni - Neurologist
</option>


<option>
Dr. Deshmukh - Orthopedic
</option>


</select>





<label>
Appointment Date
</label>


<input

type="date"

name="appointment_date"

required>





<label>
Phone Number
</label>


<input

type="text"

name="phone"

placeholder="10 digit mobile number"

pattern="[0-9]{10}"

required>





<label>
Disease / Health Problem
</label>


<input

type="text"

name="disease"

placeholder="Enter disease/problem"

required>






<label>
Appointment Type
</label>


<select name="type">


<option>
Regular Checkup
</option>


<option>
Emergency
</option>


<option>
Follow Up
</option>


</select>






<button type="submit">

📅 Confirm Appointment

</button>



</form>



</div>






<footer>

<p>
© 2026 Hospital Management System
</p>


</footer>



</body>


</html>
